[package]
name = "brass-native-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Read-only, cancelable native indexing/search pilot for Brass editor hosts"

[lib]
path = "src/lib.rs"

[[bin]]
name = "brass-native-service"
path = "src/main.rs"

[dependencies]
# brass-engine-core stays in the brass-runtime repository: it is shared with
# the WASM engine. Pin a tag once brass-runtime publishes one.
brass-engine-core = { git = "https://github.com/BaldrVivaldelli/brass-runtime.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
