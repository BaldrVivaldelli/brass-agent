version: 2
updates:
  # npm (TypeScript/Node del proyecto)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    # Evita ruido por majors (igual te llegarán PRs de seguridad si aplica)
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    # Agrupa cambios típicos de tooling para que salgan en un solo PR
    groups:
      patches:
        update-types: ["patch"]
      minors:
        update-types: ["minor"]
      lint-test-ts:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "@types/*"
          - "typescript"
          - "vitest*"
          - "vite*"
        update-types: ["minor", "patch"]

  # npm (extensión de VS Code)
  - package-ecosystem: "npm"
    directory: "/extensions/vscode-brass-agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:10"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(vscode-extension)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      vscode-extension-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Cargo (workspace Rust en la raíz)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:20"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions (archivos en .github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Argentina/Buenos_Aires"
    commit-message:
      prefix: "deps(actions)"
    ignore:
      # The action tag is also interpreted as the Rust toolchain. Dependabot
      # can see future action tags before that Rust release exists, producing
      # a workflow-wide rustup 404. Toolchain bumps stay deliberate and pinned.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      gha-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
